services:
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - testplatform

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://${EB_DOMAIN:-localhost}","http://${EB_DOMAIN:-localhost}"]'
    depends_on:
      - redis
    networks:
      - testplatform

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - testplatform

networks:
  testplatform:
    driver: bridge
