services:
  postgres:
    image: postgres:14-alpine
    container_name: testplatform_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testplatform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testplatform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: testplatform_redis
    restart: always
    networks:
      - testplatform

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testplatform_backend
    restart: always
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - testplatform

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testplatform_celery
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod
    depends_on:
      - backend
    networks:
      - testplatform

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testplatform_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - testplatform

volumes:
  postgres_data:

networks:
  testplatform:
    driver: bridge
